o seu clube fica guardado na temporada. Abra pelo botão Súmula no Calendário ou no Último jogo do Painel: placar, pênaltis, posse e finalizações, escalações com notas, gols, cartões, trocas e lesões e, se houve, a disputa de pênaltis cobrança por cobrança. A súmula zera na virada da temporada. Tabelas mostram GP (gols feitos), GC (gols tomados) e SG (saldo); a ficha do clube traz as últimas temporadas com a mesma conta.</p>")}\n  ${a("Salvar em arquivo e jogo offline","<p>As carreiras ficam guardadas no navegador. Limpar o histórico ou o cache apaga tudo, e o link publicado e a versão offline usam espaços separados. Para não perder nada: <b>Exportar</b> (em Carregar jogo, em cada carreira, ou em Configurações) baixa um arquivo .json com a carreira inteira; <b>Importar</b> lê esse arquivo e põe a carreira na lista, como uma carreira nova (a atual continua salva). Se o navegador não deixar baixar ou escolher arquivo, as mesmas telas oferecem copiar e colar o texto.</p><p>Todo save guarda a versão do jogo. Ao abrir uma carreira de versão anterior, o jogo avisa de qual versão ela veio e passa a gravá-la na versão atual. Uma carreira de versão mais nova pode não abrir direito numa versão antiga.</p><p>Versão offline: extraia o zip ProCoach e dê dois cliques em jogar.html (funciona sem internet no computador). A pasta saves é o lugar sugerido para guardar os arquivos exportados; a pasta versoes traz a versão anterior, para voltar se der problema.</p>")}\n  ${a("Como o jogo é calculado","<p>A partida é simulada minuto a minuto. Cada time tem um número de ataque e um de defesa, formados por: força dos jogadores (ajustada pela energia), posição de cada um na prancheta, estilo, marcação, postura, encaixe de características com o estilo, capitão, craques, duelos de características e mando de campo (0,6 mais até 1,4 do CT).</p><p>Gols esperados por minuto: mandante 1,12 × e<sup>(ataque − defesa rival) ÷ 17</sup> × 1,08 × 0,93 ÷ 90; visitante 0,9 × e<sup>(ataque − defesa rival) ÷ 17</sup> × 0,93 ÷ 90. Força efetiva = força × (0,7 + 0,3 × energia).</p><p>Acréscimos pelo que aconteceu: 1º tempo de 1 a 3 minutos, 2º tempo de 3 a 7. Nos acréscimos toda ação tem o dobro da chance.</p><p><b>Pênaltis (mata-mata):</b> empate no agregado (ou no jogo único) vai para a disputa: 5 cobranças alternadas, que acaba assim que um lado não consegue mais alcançar o outro; se continuar empatado, vêm as alternadas até alguém errar. Batem primeiro os mais fortes e os de Frieza; o goleiro entra por último. Chance de cada cobrança: 75% mais 0,6 ponto por ponto de força acima de 74 (entre 50% e 92%), +7 com Frieza; o goleiro tira 5 com Reflexos e 9 com Defesa de pênaltis (mais 7 se também tiver Frieza). No ao vivo, a disputa aparece cobrança por cobrança depois do apito final (botão Pular disputa).</p>")}\n  ${a("Substituições e jogador a menos","<p>Cada time tem 5 substituições em até 3 paradas, mais o intervalo (as trocas do intervalo não gastam parada). Várias trocas no mesmo jogo parado, ou programadas para o mesmo minuto, contam como 1 parada. A troca forçada por lesão vale mesmo sem parada livre. Dá para desfazer as trocas da parada atual (ou do intervalo) até a bola rolar, e cancelar trocas programadas.</p><p>Com um expulso, o jogo para sozinho para o técnico humano: o time é remontado numa formação para 10 (4-4-1, 4-3-2, 5-3-1, 3-4-2 ou 3-5-1) e dá para escolher outra e remontar sem gastar substituição. O mesmo vale para lesão sem troca disponível.</p>")}\n  ${a("Cartões e suspensões",e(["Situação","Suspensão"],[["3º amarelo na mesma competição","1 jogo nessa competição (o contador volta a zero)"],["Cartão vermelho","1 jogo na competição em que foi recebido"],["Julgamento (2% dos vermelhos)","2 a 10 jogos, com mais chance das penas baixas"],["Amarelo + vermelho pendentes","somam (ex.: 2 jogos)"]])+"<p>Os amarelos são contados separadamente em cada competição (Série A/B, Copa do Brasil, Libertadores, Sul-Americana); no Mundial só o vermelho suspende. A suspensão só é cumprida em jogos da competição em que foi recebida e tudo zera na virada da temporada. Suspensos e lesionados aparecem em cinza e não podem ser escalados.</p>")}\n  ${a("Posições e prancheta",e(["Situação","Perda de força"],[["Posição natural ou 2ª posição (MC joga de VOL e de MEI sem perda)","0"],["Lateral de ala (e vice-versa), meia aberto de ponta (e vice-versa), SA de ATA ou de MEI (e vice-versa)","−1"],["Lado trocado (lateral, ala, meia aberto ou ponta); ala de meia aberto; MEI ou MC de meia aberto","−1,5 (o lado trocado soma: LD de ADE = −2,5)"],["MC jogando de ponta ou de SA","−2"],["Vizinha, com característica útil","−3"],["Vizinha, sem característica útil","−4,5"],["Longe, com característica que salva","−5"],["Completamente fora","−10"],["Goleiro na linha ou linha no gol","−15"]])+"<p>Posições (15): GOL, ZAG, LD, LE, ADD e ADE (alas), VOL, MC (meio-campista: volante e meia), MEI, MD e ME (meias abertos), PD e PE (pontas), SA (segundo atacante ou falso 9) e ATA. Vizinhas: ZAG–laterais–VOL, VOL–MEI, MEI–pontas–ATA, laterais–pontas do mesmo lado, lateral–ala–meia aberto–ponta pelo mesmo lado e MEI–SA–ATA.</p><p>2ª posição: alguns jogadores têm uma segunda posição vizinha (ex.: LD/ADD) e jogam nela sem perda. Ela aparece ao lado da posição (LD/ADD) e no editor de equipes.</p><p>Formações: 4-4-2 quadrado (2 VOL e 2 MEI), 4-4-2 com alas (ME e MD abertos), 4-4-1-1 e 4-2-3-1 (com SA), 4-3-3 e 3-4-3 (pontas), 4-5-1, 3-5-2 (alas ADD/ADE contam como meio) e 5-3-2 (alas na linha de 5, contam como defesa). Com um a menos, a remontagem também tem versões com alas e com SA.</p><p>Escalação automática (6.6): cada vaga vai primeiro para quem joga ali na posição natural ou na 2ª posição. A variação de perda 1 (lateral de ala, meia aberto de ponta, SA de ATA ou de MEI) só entra se faltar jogador da posição ou se o jogador render 5 pontos ou mais acima do titular da posição, já descontada a perda. Fora de posição, só nas vagas que ainda sobrarem (expulsão, lesões, elenco curto). As vagas são montadas na hora de cada jogo, iguais às que a prancheta mostra. Na escalação manual vale a prancheta como você montou.</p>")}\n  ${a("Características",e(["Característica","Função","Efeito"],[["Velocista","neutra","Duelo de velocidade; reforça Drible, Finalizador, Cruzamento e Marcação quando combinada"],["Finalizador","armador","Mais gols por chance"],["Cabeceio","volante","Duelo aéreo e bola parada"],["Armação","armador","Cria chances; base da posse"],["Drible","armador","Duelo individual"],["Cruzamento","armador","Alimenta o jogo aéreo"],["Marcação","volante","Anula atacantes"],["Passe longo","armador","Lançamentos e contra-ataque"],["Fôlego","volante","Cansa 30% menos e recupera +4"],["Liderança","volante","Bônus de capitão"],["Bola parada","armador","Faltas e escanteios"],["Desarme","volante","Corta drible e criação"],["Visão de jogo","armador","+0,35 de ataque cada (até 3)"],["Chute de longe","armador","Rende mais contra retranca"],["Posicionamento","volante","+0,35 de defesa cada (até 3)"],["Força física","volante","Cansa 10% menos e ganha o corpo a corpo"],["Raça","volante","Rende mais perdendo e nos acréscimos; leva mais cartão"],["Frieza","premium, só como 2ª","Decide em jogo difícil e em pênaltis"],["Reflexos","goleiro","Defende mais"],["Saída do gol","goleiro","+0,5 de defesa"],["Defesa de pênaltis","goleiro","Pega 1 a cada 3 (com Frieza, 1 a cada 2,5)"],["Jogo com os pés","goleiro","+0,3 de ataque; combina com a posse"]])+"<p>Todo jogador tem ao menos 1 característica; goleiro com 2 é só de primeira linha.</p>")}\n  ${a("Estilos",e(["Estilo","Primárias","Secundárias"],Object.values(STYLES).map(a=>[a.n,a.prim.map(a=>TRAITS[a].n).join(", "),a.sec.map(a=>TRAITS[a].n).join(", ")])))}\n  ${a("Craques e prêmios",e(["Selo","Como conquista","Bônus (normal / jogo difícil)","Salário"],[["★ Craque","Seleção do campeonato","+0,5 / +1","1,3x"],["★★ Supercraque","Bola de Ouro ou Chuteira de Ouro","+1 / +2","1,8x"],["★★★ Lenda","Duas Bolas de Ouro","+1,5 / +3","2,5x"]])+"<p>Jogo difícil: mata-mata, final, clássico ou rival de patamar superior. O selo vale enquanto o jogador tiver força 75 ou mais.</p>")}\n  ${a("Estatísticas e prêmios","<p>Todo jogo oficial (Brasileirão, Copa do Brasil, Libertadores, Sul-Americana e Mundial) conta jogos, gols, assistências, cartões, jogos sem sofrer gol (goleiros) e nota, separados por clube e competição. A Champions não entra.</p><p><b>Artilharia</b> da Série A e da Série B soma só os gols marcados naquela divisão, mesmo que o jogador tenha passado por dois clubes dela. Gols na outra divisão ou em copas não entram. É ela que decide a Chuteira de Ouro.</p><p><b>Prêmios · disputa ao vivo</b> (Tabelas, ao lado da Artilharia): Luva de Ouro (goleiros) e Revelação (até 21 anos) pela maior nota média na divisão. A Bola de Ouro (6.6) vai para quem mais se destaca na própria posição: a nota de cada um é comparada com a dos jogadores do mesmo setor (goleiros, zagueiros, laterais, meio, ataque), e a coluna Dest. mostra essa distância. Assim um zagueiro ou um lateral excelente disputa com o artilheiro. Entre os 10 primeiros entram no máximo 4 atacantes e 1 goleiro. Durante a temporada, o mínimo é 40% das rodadas; no fim, 15 jogos. Os prêmios da Série B ficam no Histórico, mas selos e reajustes de salário vêm só da Série A e da Seleção do campeonato.</p><p><b>Carreira:</b> clique no nome do jogador (Elenco, Artilharia, Prêmios, Melhores de sempre) para ver temporada por temporada, clubes, títulos e prêmios. No Elenco, Nota é a média da temporada em todas as competições. Na virada, a temporada é resumida e guardada; aposentados e vendidos ao exterior ficam num resumo em Histórico › Melhores de sempre.</p>")}\n  ${a("Lesões",e(["Gravidade","Tempo fora","Frequência"],[["Leve","1 jogo","70%"],["Média","cerca de 4 jogos","22,8%"],["Grave","cerca de 20 jogos","7%"],["Ultra grave","1 ano","0,2%"]])+"<p>O departamento médico encurta as lesões. Veteranos (linha acima de 30, goleiro acima de 34) se machucam 5% mais por ano a mais e com lesões mais graves.</p><p>Energia: um jogo de 90 minutos tira cerca de 17 pontos (mais com pressão e marcação forte). A recuperação é por dia entre os jogos: 8 até 23 anos, 7 até 29, 6 até 32 e 5 depois, mais Fôlego e departamento médico. A recuperação por dia de descanso depende da idade: até 23 anos 6 · 24 a 27 anos 5 · 28 a 30 anos 3,5 · 31 a 33 anos 2,5 · 34 anos ou mais 1,5 (Fôlego soma 1 por dia e o departamento médico ajuda). O jovem aguenta sequência; o veterano precisa de rodízio. A IA poupa o titular abaixo de 80% de energia quando tem um substituto da posição que não enfraqueça demais o time.</p>")}\n  ${a("Evolução e base","<p>O potencial é oculto em todas as telas e é sorteado a cada nova carreira, só pela força e pela idade (jovens têm mais espaço para crescer; 3% dos jovens são joias). A cada temporada o jogador faz um sorteio: tantas tentativas quanto a distância até o potencial, cada uma com chance conforme a idade (30% até 21 anos, 25% até 24, 18% até 27, 12% até 29, 7% até 31; goleiro 6 anos depois), metade jogando menos de 8 partidas e menor para quem já é muito forte (85+ metade, 90+ um quarto). Quanto mais perto do potencial, menos ganha. Destaque da temporada (15+ jogos e nota 0,5 acima da média do elenco) pode ganhar +1 extra e passar do potencial em até 3 na carreira.</p><p>Declínio a partir dos 32 (goleiro 38): metade para quem jogou 20+ partidas, em dobro para quem jogou menos de 5. Veterano se machuca mais e mais gravemente. Aposentadoria a partir dos 33 (goleiro 37), sem idade obrigatória: a chance cresce com a idade e com o banco cheio de gente melhor na posição. Quando um craque de elite se aposenta, surge um garoto parecido na base de um clube da mesma série.</p><p>Na base, o garoto entra mais cru (bem abaixo do potencial) e evolui pelo mesmo sorteio, mais rápido com investimento. As bolinhas são a estimativa do olheiro, mais precisa com a idade. Peneira: R$ 1 mi, até 5 candidatos, até 2 escolhidos, até 2 por ano.</p>")}\n  ${a("Tamanho do elenco e empréstimos","<p>Elenco profissional: no máximo 33 jogadores para o técnico humano e 30 para a IA (os garotos da base não contam). Com o elenco cheio não dá para contratar, pegar emprestado nem promover da base: venda ou empreste alguém antes. Jogador emprestado a outro clube não ocupa vaga no seu elenco.</p><p>No novo jogo os clubes começam com o núcleo de 3 goleiros, 4 zagueiros, 4 laterais/alas, 8 meio-campistas e 6 atacantes (pontas e SA contam no ataque), e no máximo 30 jogadores: nos elencos reais maiores ficam o núcleo e os melhores que sobram, e os cortados vão para o mercado livre. Elencos importados ou salvos no editor (como o Cruzeiro do Lucas) valem como vieram; River, Boca, Racing, Estudiantes e Vélez entram com o elenco real (força calculada pelos minutos na temporada, papel, idade e força do clube; potencial sorteado pelo jogo); se faltar gente num setor, a IA completa com compras nas janelas.</p><p>A IA no teto que quer um reforço põe à venda o pior de um setor acima do núcleo; se ninguém comprar até o fim da janela e o valor for baixo, ela o dispensa e faz a contratação. Base: o garoto sobe quando está pronto ou aos 21 anos, sempre com vaga. Na IA, o de 21 sem vaga sobe se for melhor que o pior do setor da posição ou da 2ª posição (que é dispensado); só se não encaixar em nenhum ele é dispensado. No seu clube, o de 21 sem vaga espera na base até você abrir espaço.</p><p>Emprestar: com a janela aberta, o botão Emprestar no Elenco mostra até 3 clubes da IA interessados (com vaga, folga na folha e onde ele seria titular ou brigaria por posição). O clube que recebe paga o salário até o fim da temporada e o jogador volta na virada.</p>")}\n  ${a("Vendas e propostas","<p>Para vender, clique em Vender no Elenco ou na Base. Leilão rápido: os clubes da IA com interesse, vaga e caixa respondem na hora, de 0 a 4 propostas entre 80% e 120% do valor de mercado (sobem com nota boa, idade até 26, selo e necessidade do comprador na posição; descem com idade acima de 30 e lesão). Você aceita uma ou recusa todas; um leilão por jogador por janela. Preço fixo: você define o preço e, a cada rodada do Brasileirão com a janela aberta, a chance de aparecer comprador é 60% × (valor ÷ preço)³: preço igual ao valor 60%, 20% acima 35%, 50% acima 18%, o dobro 8%. Pode retirar quando quiser.</p><p>Propostas da IA: com a janela aberta, clubes da IA fazem propostas pelos seus jogadores e pelos garotos promissores da sua base (aceitar ou recusar; valem até a janela fechar). Garotos da base são negociáveis: o comprado vai para a base do comprador, e o preço segue o potencial estimado pelo olheiro e a raridade (joia custa caro). Na aba Garotos da base do Mercado você faz proposta pelos garotos da IA. Venda no meio do ano tem multa de 10% e de quem foi comprado na mesma janela, 20%.</p><p>Caixa negativo por mais de 5 rodadas: a diretoria pode abrir um leilão forçado de um dos maiores salários; você escolhe a proposta (sem recusar) e, se não escolher, na data seguinte ela aceita a maior. Sem propostas, ele é vendido para o exterior por 75% do valor.</p><p><b>Jogadores do exterior (6.6):</b> quem vem de fora pode recusar a proposta, principalmente quem joga na Europa. A resistência é menor para clube de prestígio Continental ou Mundial (um pouco menor para Nacional) e cai quando você oferece salário ou valor de transferência acima do pedido. Veteranos (31+) aceitam mais fácil.</p>")}\n  ${a("Finanças e estrutura","<p>Receita: cota de TV (50% fixa, 50% pela posição anterior), patrocínio, bilheteria, premiações e vendas. Despesa: salários e custos fixos de 35% da receita prevista (marketing 9%, comissão técnica e staff 12%, estrutura e operação 14%), mais base, peneiras e obras. A venda de um jogador volta 100% para a verba de contratação.</p><p><b>Verba da diretoria:</b> receita prevista menos os 35% e o contrato anual da base, mais 25% do caixa e, desde a 6.6, mais 20% do caixa que passar de uma receita anual (caixa acumulado vira verba). Você divide entre salários e contratações; a barra não desce abaixo da folha atual e só vale depois do OK. O topo mostra o caixa e a verba de contratação.</p><p><b>Salários (6.6):</b> quem troca de clube pede o salário atual, dentro da faixa de mercado da força dele, mais 5% (livre vindo do exterior: 20%). Todo ano o salário de quem evoluiu sobe 25% da diferença para o salário de mercado. O elenco campeão brasileiro recebe um prêmio único de 10% da folha anual, pago do caixa, sem aumento permanente.</p><p><b>Patrocínio (6.6):</b> três propostas por temporada. A Conservadora paga quase tudo fixo, mas menos que as outras num ano normal; a Equilibrada fica no meio; a Arriscada tem o menor fixo e os maiores bônus, e passa do dobro da Conservadora se todas as metas forem batidas.</p><p><b>Base:</b> contrato anual (Básico R$ 1 mi, Médio 3, Alto 6, Máximo 12), fixado para a temporada inteira; dá para trocar até o 1º jogo, depois a troca vale para o ano seguinte. A peneira custa metade do contrato anual do nível.</p><p><b>Empréstimo:</b> sem negociação. Você paga o salário atual do jogador até o fim da temporada, e ele aceita ou recusa (a resposta vale para a janela inteira).</p><p><b>Infraestrutura:</b> começa no nível 0 e cada nível custa 1,8 vez o anterior; o estádio chega a 100 mil lugares no nível 5. Uma obra por setor por temporada (CT, departamento médico e estádio podem andar juntos); fica pronta na temporada seguinte. Manutenção: 3% ao ano do que foi investido em obras.</p><p><b>Prestígio do clube:</b> Regional, Estadual, Nacional, Continental ou Mundial. A faixa muda um degrau por temporada, por títulos (contados desde o início da carreira) ou por presença nas últimas 6 temporadas (6.6): Estadual = 2 títulos da Série B ou 3 temporadas na Série A · Nacional = 2 títulos da Série A (ou 1 Série A e 2 Copas do Brasil) ou G-8 em 3 temporadas · Continental = 2 Libertadores ou 4 Libertadores disputadas · Mundial = 2 títulos mundiais. A cada mudança de faixa a contagem de presença recomeça. A Sul-Americana não conta para a faixa. Cai uma faixa com 8 temporadas seguidas sem o que a mantém (título mundial; Libertadores disputada ou título nacional; G-8 ou título nacional; temporada na Série A para o Estadual) e, de Nacional para cima, com 2 rebaixamentos em 5 anos; depois de cair, voltar exige conquistas ou temporadas novas. Regional é o piso. Na Diretoria aparece o que falta.</p><p>Além da faixa, cada clube tem pontos de prestígio ocultos que mudam toda temporada (título +3 a +5, superar a meta +2, cumprir +1, não cumprir −1, rebaixamento −3) e definem patrocínio, metas e a atração de jogadores.</p><p><b>Clubes da IA com muito caixa</b> (acima de 2 vezes a receita prevista) gastam mais: folha mais folgada, até 3 reforços por janela comprados de qualquer clube, e 50% do que passa de 2 vezes sai por ano em estrutura. Quando a folha passa do teto, o clube vende um dos salários mais altos: o jogador leva o mesmo salário e o comprador precisa ter folga na folha; sem comprador, ele vai para o exterior (6.6).</p>")}\n  ${a("Dificuldade",e(["Nível","Coeficiente"],DIFFS.map(a=>[a.n,String(a.k).replace(".",",")+"x"]))+"<p>Multiplica, só para os técnicos humanos, o preço e o salário pedidos, a perda de prestígio e a exigência da meta.</p><p>Nas partidas contra a IA: no Fácil o seu time tem +3% de força; no Normal não há ajuste; no Difícil o adversário tem +3% e no Lenda +6%. No Difícil e no Lenda a IA também joga melhor contra você: muda o estilo quando perde o confronto tático, segura ou abre o jogo conforme o placar e o tempo, faz 1 troca no intervalo, 2 aos 65 e 1 aos 80 minutos, tira jogador amarelado e guarda a 5ª troca para lesão ou expulsão (se sobrar, entra depois dos 85 por cansaço). Jogos entre dois técnicos humanos nunca têm ajuste.</p>")}\n  ${a("Técnicos e imprensa","<p>Clubes da IA demitem e contratam técnicos reais. Com prestígio médio acima de 70, o técnico humano pode recebe
